packages:
  - '.'

overrides:
  js-cookie: 3.0.7
  form-data@<4.0.6: '>=4.0.6'
  # Pin past GHSA-r28c-9q8g-f849 / GHSA-6g55-p6wh-862q (>=8.5.18).
  # 8.5.23 is still inside pnpm 11's default minimumReleaseAge window.
  postcss: 8.5.22
  # Pin past sanitizer-bypass XSS advisories (GHSA-cg2g-xh64-v4q7 / GHSA-mrv2-3pqr-j5jr).
  'dompurify@<3.4.17': '>=3.4.17'
  # Pin past prototype pollution (GHSA-68fv-2mgg-jv7q).
  'source-map-js@<1.2.2': '>=1.2.2'
  'follow-redirects@<1.16.1': '>=1.16.1'

# Dependencies whose lifecycle scripts are required by the production build.
allowBuilds:
  esbuild: true
  vue-demi: true
